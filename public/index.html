<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="browser">


        <main class="view active" id="login-view">
            <form class="login-card" id="loginForm">
                <h2>Sign in</h2>
                <p class="welcome" id="welcomeText">
                    Welcome back. Two fields stand between you and the dashboard.
                </p>

                <div class="field-group" style="display: flex; gap: 20px; margin-bottom: 20px;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: #8b9a96; font-size: 13px; font-weight: 600;">
                        <input type="radio" name="role" value="employee" checked> Employee
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: #8b9a96; font-size: 13px; font-weight: 600;">
                        <input type="radio" name="role" value="manager"> Manager
                    </label>
                </div>

                <div class="field-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="username" autocomplete="username" placeholder="Enter username" required>
                    </div>
                </div>

                <div class="field-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="4" y="10" width="16" height="11" rx="2"></rect>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                        </svg>
                        <input type="password" id="password" autocomplete="current-password"
                            placeholder="At least 6 characters" required>
                        <svg id="togglePassword" class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </div>
                    <div class="error-msg" id="errorMsg"></div>
                </div>

                <button type="submit" class="btn-primary runaway" id="loginButton">
                    Log in
                </button>
            </form>
        </main>
    </div>

    <script src="js/login.js"></script>
</body>

</html>
